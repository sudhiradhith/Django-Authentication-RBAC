<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lab 3B: Django Authentication & RBAC{% endblock %}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
      color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header.site-header {
      width: 100%;
      max-width: 820px;
      margin-bottom: 20px;
    }
    nav.navbar {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      color: #1e3a8a;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .nav-links a {
      color: #334155;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-links a:hover {
      background: #eff6ff;
      color: #2563eb;
    }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
    }
    .role-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .role-student { background: #dbeafe; color: #1e40af; }
    .role-teacher { background: #fef3c7; color: #92400e; }
    .role-admin   { background: #fee2e2; color: #991b1b; }
    .role-general { background: #e2e8f0; color: #475569; }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: {% block card_width %}560px{% endblock %};
      border-radius: 18px;
      padding: 34px 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
      text-align: center;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 22px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
    }
    .msg-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .msg-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .msg-info    { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

    form p {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }
    input[type=text],
    input[type=email],
    input[type=password],
    select {
      width: 100%;
      padding: 10px 13px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      color: #0f172a;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .helptext, .helptext ul {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 5px;
      padding-left: 0;
      list-style: none;
      line-height: 1.4;
    }
    .helptext li { margin-bottom: 2px; }
    .errorlist {
      list-style: none;
      margin: 0 0 8px;
      padding: 8px 12px;
      background: #fef2f2;
      color: #dc2626;
      border-left: 4px solid #dc2626;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 500;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 11px 16px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:active { transform: translateY(1px); }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 12.5px;
      color: #64748b;
    }
    .footer-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover { text-decoration: underline; }

    /* Custom styles for tables and dashboard widgets */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .stat-title { font-size: 11.5px; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .stat-val { font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 4px; }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
    }
    table.data-table th, table.data-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    table.data-table th {
      background: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="{% url 'home' %}">
        🎓 <span>EduPortal &bull; Lab 3B</span>
      </a>

      <div class="nav-links">
        <a href="{% url 'home' %}">🏠 Home</a>

        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}">📊 Dashboard</a>
          <a href="{% url 'student_dashboard' %}">🎓 Student Portal</a>
          <a href="{% url 'teacher_dashboard' %}">👨‍🏫 Teacher Portal</a>
          <a href="{% url 'logout' %}">🚪 Logout</a>
          <div class="nav-user">
            <span>👤 {{ user.username }}</span>
            <span class="role-badge {% if user_role == 'Student' %}role-student{% elif user_role == 'Teacher' %}role-teacher{% elif user_role == 'Admin' %}role-admin{% else %}role-general{% endif %}">
              {{ user_role }}
            </span>
          </div>
        {% else %}
          <a href="{% url 'register' %}">📝 Register</a>
          <a href="{% url 'login' %}">🔑 Login</a>
          <a href="/admin/" target="_blank">⚙️ Admin</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main class="card">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
